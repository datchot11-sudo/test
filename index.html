<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e90ff, #00c6ff);
            font-family: Arial, sans-serif;
        }

        .welcome-box {
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .welcome-box h1 {
            margin: 0;
            color: #1e90ff;
            font-size: 36px;
        }

        .welcome-box p {
            margin-top: 10px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>🎉 Chào mừng các bạn 🎉</h1>
        <p>Đến với trang web của chúng tôi</p>
    </div>

</body>
</html>
